name: release

# Builds the downloadable rtl-integ-gui bundles and Linux packages, tests them
# on a range of distributions and, for a v* tag, publishes them as a GitHub
# Release.  A push to a release/** branch, or running it by hand (Actions >
# release > Run workflow), is a dry run: everything is built and tested and
# the files are kept as workflow artifacts, but nothing is published.

on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyslang-glibc217:
    name: pyslang for glibc 2.17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: cache
        uses: actions/cache@v4
        with:
          path: wheelhouse
          key: pyslang-manylinux2014-${{ hashFiles('tools/bundle/versions.toml', 'tools/bundle/build_pyslang_wheel.sh', 'tools/bundle/pyslang_gcc11_compat.h') }}

      # docker run instead of a job container: the actions themselves need a newer glibc
      - name: Build in manylinux2014
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 tools/bundle/ci_run.py -- docker run --rm -v "$PWD:/io" quay.io/pypa/manylinux2014_x86_64 bash /io/tools/bundle/build_pyslang_wheel.sh /io/wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: pyslang-glibc217
          path: wheelhouse/*.whl

  bundle-linux:
    name: Linux bundle and packages
    needs: pyslang-glibc217
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: pyslang-glibc217
          path: wheelhouse

      - name: Bundle
        run: python tools/bundle/ci_run.py -- python tools/bundle/build_bundle.py --target linux-x86_64 --pyslang-wheel wheelhouse/pyslang-*manylinux2014*.whl

      - name: Self-test (stripped environment)
        run: python tools/bundle/ci_run.py -- python tools/bundle/smoke_bundle.py dist/rtl-integ-gui-*-linux-x86_64

      - name: rpm and deb
        run: python tools/bundle/ci_run.py -- python tools/bundle/package_linux.py dist/rtl-integ-gui-*-linux-x86_64 --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb

  bundle-windows:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle
        run: python tools/bundle/ci_run.py -- python tools/bundle/build_bundle.py --target windows-x86_64

      - name: Self-test (stripped environment)
        shell: bash
        run: python tools/bundle/ci_run.py -- python tools/bundle/smoke_bundle.py dist/rtl-integ-gui-*-windows-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip

  test-linux:
    name: Linux ${{ matrix.image }}
    needs: bundle-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "centos:7", pkg: rpm }
          - { image: "rockylinux:8", pkg: rpm }
          - { image: "rockylinux:9", pkg: rpm }
          - { image: "almalinux:10", pkg: rpm }
          - { image: "opensuse/leap:15", pkg: rpm }
          - { image: "ubuntu:18.04", pkg: deb }
          - { image: "ubuntu:20.04", pkg: deb }
          - { image: "ubuntu:24.04", pkg: deb }
          - { image: "debian:11", pkg: deb }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist

      # unpacked on the runner: minimal images may have no tar
      - name: Unpack
        run: mkdir x && tar xzf dist/rtl-integ-gui-*-linux-x86_64.tar.gz -C x

      - name: Portable bundle
        run: python3 tools/bundle/ci_run.py -- docker run --rm -v "$PWD:/w" "${{ matrix.image }}" sh -c '/w/x/rtl-integ-gui-*/rtl-integ-gui --version && /w/x/rtl-integ-gui-*/rtl-integ-gui --selftest'

      - name: Package
        run: |
          if [ "${{ matrix.pkg }}" = rpm ]; then inst='rpm -i /w/dist/*.rpm'; else inst='dpkg -i /w/dist/*.deb'; fi
          python3 tools/bundle/ci_run.py -- docker run --rm -v "$PWD:/w" "${{ matrix.image }}" sh -c "$inst && rtl-integ-gui --version && rtl-integ-gui --selftest"

  sources:
    name: Third-party sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python tools/bundle/ci_run.py -- python tools/bundle/third_party_sources.py --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: third-party-sources
          path: dist/*.tar.gz

  release:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle-windows, test-linux, sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the package version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: third-party-sources
          path: assets

      - name: Checksums
        run: cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" assets/*
          --verify-tag --title "rtl-integ-gui $GITHUB_REF_NAME" --notes-file tools/bundle/release_notes.md
