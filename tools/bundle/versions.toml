# Pinned components of the self-contained rtl-integ-gui bundles, per target.
# Every download is checked against its sha256 (an empty one is filled in by
# build_bundle.py --update-pins on the first download).

[python]
version = "3.12.13"
license = "PSF-2.0 (and the licenses of the libraries it links, in LICENSES/python/)"
source = "https://github.com/python/cpython/tree/v3.12.13, built by https://github.com/astral-sh/python-build-standalone/tree/20260408"
windows-x86_64 = { url = "https://github.com/astral-sh/python-build-standalone/releases/download/20260408/cpython-3.12.13%2B20260408-x86_64-pc-windows-msvc-install_only_stripped.tar.gz", sha256 = "802162fb50165fc138db0c737abda695e1cb819bfb52e4d230d14f8a5af880b2" }
linux-x86_64 = { url = "https://github.com/astral-sh/python-build-standalone/releases/download/20260408/cpython-3.12.13%2B20260408-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz", sha256 = "ddd48f521f79395d9b8b094d34a86d7ec86772ab66c96b0de65a3b561ea7cf10" }
# licenses/python/ is the python/licenses/ directory of this archive (build_bundle.py --refresh-licenses)
licenses = { url = "https://github.com/astral-sh/python-build-standalone/releases/download/20260408/cpython-3.12.13%2B20260408-x86_64-unknown-linux-gnu-debug-full.tar.zst", sha256 = "8278f46114c44b3b63b40b1d4ae88f521d9c5e314e9727e762896b33ce74db1d" }

[neovim]
version = "v0.12.5"
license = "Apache-2.0 AND Vim, with third-party parts incl. LGPL libraries (LICENSES/neovim-LICENSE.txt)"
source = "https://github.com/neovim/neovim/tree/v0.12.5"
windows-x86_64 = { url = "https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-win64.zip", sha256 = "de8625ba8cf65ebf40eb80a388ba1ec8e9c15b30218821e2c639119b05920de1" }
# the glibc 2.17 build of the same release (the official Linux build needs glibc 2.34)
linux-x86_64 = { url = "https://github.com/neovim/neovim-releases/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz", sha256 = "9e4a0e9c2aebbcf1eb5f6cdf645b460c9249f517650d0191170f9f152ecfd721" }

[neovide]
version = "0.16.2"
license = "MIT"
source = "https://github.com/neovide/neovide/tree/0.16.2"
windows-x86_64 = { url = "https://github.com/neovide/neovide/releases/download/0.16.2/neovide.exe.zip", sha256 = "d1e071d8bf676a500988820b852843e811fc8355396ce72e8f4c7ed2c744e2e2" }
# needs glibc 2.35; on older systems the launcher starts terminal Neovim instead
linux-x86_64 = { url = "https://github.com/neovide/neovide/releases/download/0.16.2/neovide-linux-x86_64.tar", sha256 = "d3f4a50921b7144d6ab45096587d5f9bef3ad167f3d83e522e100b73efa73560" }

[pyslang]
version = "11.0.0"
license = "MIT"
source = "https://pypi.org/project/pyslang/11.0.0/ (https://github.com/MikePopoloski/slang)"
sdist = { url = "https://files.pythonhosted.org/packages/36/8d/65400aa82cea1e48de2b9992b0470a30ea9626956b196fa45d4cf5cdce5e/pyslang-11.0.0.tar.gz", sha256 = "9736e6faa048a3d06c5c9cd795b540ee24a6053d337428a66a62194b3256829d" }
# wheels are looked up on PyPI (sha256 from PyPI's digests)
windows-x86_64 = { tag = "cp312-cp312-win_amd64" }
# PyPI's Linux wheel needs glibc 2.28; release bundles install a glibc 2.17 build of
# the sdist instead (build_pyslang_wheel.sh, passed as --pyslang-wheel)
linux-x86_64 = { tag = "cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64" }

# Build tools (not shipped): nfpm makes the .rpm/.deb packages (package_linux.py)
[nfpm]
version = "v2.47.0"
linux-x86_64 = { url = "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz", sha256 = "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783" }

